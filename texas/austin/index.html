<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Home Remodeling Cost</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background: #f9fafb; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: #111; font-size: 1.8rem; text-transform: capitalize; }
        .price { font-size: 1.5rem; color: #2563eb; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="heading">Home Remodeling Cost in City</h1>
        <p>Estimated average cost for a standard kitchen and bathroom remodel in <span id="city-name">City</span>, <span id="state-name">State</span>:</p>
        <div class="price" id="cost-display">$Loading...</div>
        <p>Get a precise, personalized quote for your project within minutes using our official estimator below.</p>
    </div>

    <!-- Tally Form Embed -->
    <div class="card">
        <iframe data-tally-src="https://tally.so/embed/m98xxxx?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="300" frameborder="0" marginheight="0" marginwidth="0" title="Cost Calculator"></iframe>
        <script>window.Tally||(d=document,s=d.createElement("script"),s.src="https://tally.so/widgets/embed.js",v=d.getElementById("tally-js")||d.getElementsByTagName("head")[0].appendChild(s));</script>
    </div>

    <script>
        // URL'den eyalet ve şehri yakala (örn: /texas/austin/ index.html)
        const pathSegments = window.location.pathname.split("/").filter(Boolean);
        const state = pathSegments[0] || "us";
        const city = pathSegments[1] || "general";

        // Şehir Çarpanları Veritabanı (Örnek Texas şehirleri)
        const cityMultipliers = {
            "austin": 1.12,
            "dallas": 1.08,
            "houston": 1.05,
            "san-antonio": 0.95,
            "fort-worth": 1.02
        };

        // Formatlama ve Hesaplama
        const baseCost = 22000; // Baz mutfak/banyo yenileme maliyeti
        const multiplier = cityMultipliers[city] || 1.0;
        const finalCost = Math.round(baseCost * multiplier);
        const maxCost = Math.round(finalCost * 1.35);

        // HTML'i güncelle
        const formattedCity = city.replace("-", " ");
        const formattedState = state.toUpperCase();
        
        document.getElementById("page-title").innerText = `Home Remodeling Cost in ${formattedCity}, ${formattedState} | HouseCostLab`;
        document.getElementById("heading").innerText = `Home Remodeling Cost in ${formattedCity}`;
        document.getElementById("city-name").innerText = formattedCity;
        document.getElementById("state-name").innerText = formattedState;
        document.getElementById("cost-display").innerText = `$${finalCost.toLocaleString()} - $${maxCost.toLocaleString()}`;
    </script>
</body>
</html>
